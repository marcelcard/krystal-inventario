<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Krystal · Módulo de Inventario</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
/* ── ESTILOS REDUCIDOS PARA CLARIDAD ── */
:root { --navy: #0f0f1e; --navy2: #1a1a2e; --gold: #e0c97f; --white: #f0eff6; --gray: #8888aa; }
body { background: var(--navy); color: var(--white); font-family: 'Raleway', sans-serif; margin: 0; }
header { background: #16213e; border-bottom: 1px solid var(--gold); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
.kr-logo-svg { width: 40px; height: auto; }
.brand h1 { font-family: 'Barlow Condensed'; font-size: 1.2rem; margin: 0; color: white; text-transform: uppercase; }
main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
.card { background: var(--navy2); padding: 2rem; border-radius: 10px; border: 1px solid rgba(224,201,127,0.2); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
label { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; display: block; margin-bottom: 0.3rem; }
input, select, textarea { width: 100%; padding: 0.6rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(224,201,127,0.3); color: white; border-radius: 5px; }
.btn-primary { background: var(--gold); color: var(--navy); border: none; padding: 1rem; width: 100%; font-weight: 700; cursor: pointer; margin-top: 1rem; border-radius: 5px; }
#statusMsg { margin-top: 1rem; padding: 0.8rem; border-radius: 5px; display: none; text-align: center; }
.ok { background: rgba(45,212,191,0.1); color: #2dd4bf; border: 1px solid #2dd4bf; }
iframe { display: none; } /* Oculto */
</style>
</head>
<body>

<header>
    <svg class="kr-logo-svg" viewBox="0 0 60 70" fill="none"><rect x="8" y="10" width="10" height="50" fill="white"/><rect x="22" y="25" width="10" height="35" fill="white"/><rect x="36" y="15" width="10" height="45" fill="white"/><rect x="8" y="8" width="38" height="5" fill="#FFE600"/></svg>
    <div class="brand"><h1>Krystal Soluciones</h1><p style="font-size:0.6rem; color:var(--gold); margin:0;">Módulo de Inventario</p></div>
</header>

<main>
    <div class="card">
        <!-- FORMULARIO TRADICIONAL QUE APUNTA AL IFRAME -->
        <form id="inventarioForm" action="https://script.google.com/macros/s/AKfycbwRZB7tswXbF6Dj_ZCAsWLQ-sUmTqSBsgZpU1WM3lWQH3lleeSkXhpmLKChe_212P7J/exec" method="POST" target="hidden_iframe">
            <div class="form-grid">
                <div class="field"><label>ID Producto</label><input type="text" name="idProducto" required></div>
                <div class="field"><label>Nombre</label><input type="text" name="nombre" required></div>
                <div class="field"><label>Cantidad</label><input type="number" name="cantidad" value="1" required></div>
                <div class="field"><label>Bodega</label>
                    <select name="bodega">
                        <option value="Krystal">Krystal</option>
                        <option value="Carrera 30">Carrera 30</option>
                        <option value="Teusaquillo">Teusaquillo</option>
                    </select>
                </div>
                <div class="field"><label>Costo Unitario</label><input type="number" name="costoUnit" value="0"></div>
                <div class="field"><label>Fecha Factura</label><input type="date" id="fechaField" name="fechaIngreso"></div>
                <div class="field" style="grid-column: 1 / -1;"><label>Descripción</label><textarea name="descripcion" rows="2"></textarea></div>
            </div>
            <button type="submit" class="btn-primary" onclick="showSentMsg()">REGISTRAR EN GOOGLE SHEETS</button>
        </form>
        <div id="statusMsg" class="ok">✔ Enviando datos... Revisa tu Excel en 3 segundos.</div>
    </div>
</main>

<!-- El Iframe que procesa el envío sin recargar la página -->
<iframe name="hidden_iframe" id="hidden_iframe" onload="if(submitted) {resetAfterSend();}"></iframe>

<script>
    var submitted = false;
    document.getElementById("fechaField").value = new Date().toISOString().split("T")[0];

    function showSentMsg() {
        submitted = true;
        document.getElementById("statusMsg").style.display = "block";
    }

    function resetAfterSend() {
        document.getElementById("statusMsg").textContent = "✔ ¡Datos procesados! Revisa tu hoja de cálculo.";
        document.getElementById("inventarioForm").reset();
        document.getElementById("fechaField").value = new Date().toISOString().split("T")[0];
    }
</script>

</body>
</html>
