<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Krystal · Sistema de Inventario</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --navy: #0f0f1e; --navy2: #1a1a2e; --navy3: #16213e;
            --gold: #e0c97f; --gold2: #c9a84c; --gold3: #f5e6b0;
            --teal: #2dd4bf; --red: #f87171; --white: #f0eff6;
            --gray: #8888aa; --radius: 10px; --shadow: 0 8px 32px rgba(0,0,0,.55);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--navy);
            color: var(--white);
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,201,127,.08) 0%, transparent 60%);
        }

        /* ── HEADER ESTILO KRYSTAL ── */
        header {
            background: linear-gradient(135deg, var(--navy2) 0%, #0d1b3e 100%);
            border-bottom: 1px solid rgba(224,201,127,.25);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            height: 90px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo-wrap { display: flex; align-items: center; gap: 1rem; }
        .kr-logo-svg { width: 45px; height: auto; }
        
        .brand h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.4rem; font-weight: 700;
            color: var(--white); letter-spacing: .08em;
            text-transform: uppercase; line-height: 1;
        }

        .brand p {
            font-size: .65rem; color: var(--gold);
            letter-spacing: .15em; text-transform: uppercase;
            margin-top: 2px; font-weight: 600;
        }

        /* ── NAVEGACIÓN ── */
        main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        
        .tabs {
            display: flex; gap: .5rem;
            border-bottom: 1px solid rgba(224,201,127,.15);
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: none; border: none;
            padding: .75rem 1.5rem;
            color: var(--gray); cursor: pointer;
            text-transform: uppercase; font-weight: 600;
            font-size: .85rem; letter-spacing: 0.1em;
            transition: 0.3s; position: relative;
        }

        .tab-btn.active { color: var(--gold); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--gold);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── TARJETAS Y FORMULARIOS ── */
        .card {
            background: var(--navy2);
            border: 1px solid rgba(224,201,127,.15);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .field { display: flex; flex-direction: column; gap: .45rem; }
        .field.full { grid-column: 1 / -1; }

        label { font-size: .7rem; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

        input, textarea, select {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(224,201,127,.2);
            border-radius: 7px; padding: .75rem;
            color: var(--white); outline: none;
            font-family: 'Raleway', sans-serif;
            transition: 0.3s;
        }

        input:focus { border-color: var(--gold); background: rgba(255,255,255,.07); }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold2), var(--gold));
            color: var(--navy);
            padding: 1rem 2rem; border: none; border-radius: 7px;
            font-weight: 700; cursor: pointer; margin-top: 1.5rem;
            text-transform: uppercase; letter-spacing: 0.1em;
            transition: 0.3s;
        }

        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* ── MENSAJES Y TABLA ── */
        #statusMsg {
            margin-top: 1.5rem; padding: 1rem;
            border-radius: 7px; display: none;
            text-align: center; font-weight: 600;
        }

        .ok { background: rgba(45,212,191,0.1); color: var(--teal); border: 1px solid var(--teal); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; color: var(--gold); padding: 1rem; border-bottom: 2px solid var(--gold); font-family: 'Cinzel'; font-size: .75rem; }
        td { padding: 1rem; border-bottom: 1px solid rgba(224,201,127,0.1); font-size: .85rem; }

        iframe { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-wrap">
            <svg class="kr-logo-svg" viewBox="0 0 60 70" fill="none">
                <rect x="8" y="10" width="10" height="50" fill="white"/>
                <rect x="22" y="25" width="10" height="35" fill="white"/>
                <rect x="36" y="15" width="10" height="45" fill="white"/>
                <rect x="8" y="8" width="38" height="5" fill="#FFE600"/>
            </svg>
            <div class="brand">
                <h1>Krystal Soluciones</h1>
                <p>Vidrio · Acero · Aluminio</p>
            </div>
        </div>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ingreso', this)">Registrar Compra</button>
            <button class="tab-btn" onclick="switchTab('inventario', this)">Ver Inventario</button>
        </div>

        <!-- PANEL DE INGRESO -->
        <div id="tab-ingreso" class="tab-panel active">
            <div class="card">
                <!-- El action debe ser tu URL de Google Script -->
                <form id="inventarioForm" action="https://script.google.com/macros/s/AKfycbwRZB7tswXbF6Dj_ZCAsWLQ-sUmTqSBsgZpU1WM3lWQH3lleeSkXhpmLKChe_212P7J/exec" method="POST" target="hidden_iframe" onsubmit="prepararEnvio()">
                    <div class="form-grid">
                        <div class="field">
                            <label>ID Producto *</label>
                            <input type="text" name="idProducto" required placeholder="Ej: V-001">
                        </div>
                        <div class="field">
                            <label>Nombre del Producto *</label>
                            <input type="text" name="nombre" required placeholder="Ej: Vidrio Templado 10mm">
                        </div>
                        <div class="field">
                            <label>Cantidad *</label>
                            <input type="number" name="cantidad" value="1" min="1" required>
                        </div>
                        <div class="field">
                            <label>Bodega Destino</label>
                            <select name="bodega">
                                <option value="Krystal">Krystal (Principal)</option>
                                <option value="Carrera 30">Carrera 30</option>
                                <option value="Teusaquillo">Teusaquillo</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Costo Unitario (COP)</label>
                            <input type="number" name="costoUnit" value="0">
                        </div>
                        <div class="field">
                            <label>Fecha de Ingreso</label>
                            <input type="date" name="fechaIngreso" id="fechaHoy">
                        </div>
                        <div class="field full">
                            <label>Notas / Descripción</label>
                            <textarea name="descripcion" rows="2"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Registrar en la Nube</button>
                </form>
                <div id="statusMsg"></div>
            </div>
        </div>

        <!-- PANEL DE TABLA -->
        <div id="tab-inventario" class="tab-panel">
            <div class="card">
                <button class="tab-btn" onclick="cargarDatos()" style="border:1px solid var(--gold); margin-bottom:1rem; padding:0.5rem 1rem;">↻ Refrescar Stock</button>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>OC</th>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Bodega</th>
                                <th>Costo Unit.</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- IFRAME OCULTO: LA CLAVE PARA EVITAR EL ERROR DE CORS AL GUARDAR -->
    <iframe name="hidden_iframe" id="hidden_iframe" onload="if(isEnviando){ finalizarEnvio(); }"></iframe>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw2yA_RRt_4AqER4h3_T8jIAD4HZQTD0U80X-hSs3a5Iu5RvrrRorhqZ6_Vc3kanHXm/exec";
        let isEnviando = false;

        // Poner fecha de hoy por defecto
        document.getElementById("fechaHoy").value = new Date().toISOString().split("T")[0];

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
            if(tab === 'inventario') cargarDatos();
        }

        function prepararEnvio() {
            isEnviando = true;
            const msg = document.getElementById("statusMsg");
            msg.textContent = "⏳ Sincronizando con Google Sheets...";
            msg.className = "ok";
            msg.style.display = "block";
        }

        function finalizarEnvio() {
            const msg = document.getElementById("statusMsg");
            msg.textContent = "✔ ¡Éxito! El registro se ha guardado correctamente.";
            document.getElementById("inventarioForm").reset();
            document.getElementById("fechaHoy").value = new Date().toISOString().split("T")[0];
            isEnviando = false;
            // Ocultar mensaje tras 4 segundos
            setTimeout(() => { msg.style.display = "none"; }, 4000);
        }

        async function cargarDatos() {
            const body = document.getElementById("tablaBody");
            body.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Cargando inventario...</td></tr>";
            
            try {
                // Fetch limpio sin headers para evitar bloqueo CORS pre-vuelo
                const res = await fetch(GAS_URL);
                const data = await res.json();
                
                body.innerHTML = data.length === 0 ? "<tr><td colspan='6'>No hay registros</td></tr>" : 
                data.map(r => `
                    <tr>
                        <td>${r.nroCompra}</td>
                        <td>${r.idProducto}</td>
                        <td style="font-weight:600">${r.nombre}</td>
                        <td style="color:var(--teal)">${r.cantidad}</td>
                        <td>${r.bodega}</td>
                        <td>$${Number(r.costoUnit).toLocaleString()}</td>
                    </tr>
                `).join("");
            } catch (e) {
                body.innerHTML = "<tr><td colspan='6' style='color:var(--red)'>Error al conectar. Verifica que el script esté publicado correctamente.</td></tr>";
            }
        }
    </script>
</body>
</html>
