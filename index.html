<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Krystal · Módulo de Inventario</title>
<link rel="icon" href="data:,"> <!-- Esto elimina el error de favicon en consola -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
/* ── ESTILOS VISUALES (REMISIÓN) ── */
:root {
  --navy: #0f0f1e; --navy2: #1a1a2e; --navy3: #16213e;
  --gold: #e0c97f; --gold2: #c9a84c; --gold3: #f5e6b0;
  --teal: #2dd4bf; --red: #f87171; --white: #f0eff6;
  --gray: #8888aa; --radius: 10px; --shadow: 0 8px 32px rgba(0,0,0,.55);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--navy); color: var(--white); font-family: 'Raleway', sans-serif; min-height: 100vh; }
header { background: linear-gradient(135deg, var(--navy2) 0%, #0d1b3e 100%); border-bottom: 1px solid rgba(224,201,127,.25); padding: 0 2rem; display: flex; align-items: center; gap: 1.5rem; height: 90px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.logo-wrap { display: flex; align-items: center; gap: 1rem; }
.kr-logo-svg { width: 45px; height: auto; }
.brand h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--white); letter-spacing: .08em; text-transform: uppercase; }
.brand p { font-size: .65rem; color: var(--gold); letter-spacing: .15em; text-transform: uppercase; margin-top: 2px; }
main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
.tabs { display: flex; gap: .5rem; border-bottom: 1px solid rgba(224,201,127,.15); margin-bottom: 2rem; }
.tab-btn { background: none; border: none; padding: .75rem 1.5rem; color: var(--gray); cursor: pointer; text-transform: uppercase; font-weight: 600; font-size: .85rem; transition: 0.3s; }
.tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.card { background: var(--navy2); border: 1px solid rgba(224,201,127,.15); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
.field { display: flex; flex-direction: column; gap: .45rem; }
.field.full { grid-column: 1 / -1; }
label { font-size: .7rem; color: var(--gray); font-weight: 600; text-transform: uppercase; }
input, textarea, select { background: rgba(255,255,255,.04); border: 1px solid rgba(224,201,127,.2); border-radius: 7px; padding: .65rem; color: var(--white); outline: none; font-family: 'Raleway', sans-serif; }
input:focus { border-color: var(--gold); }
.btn-primary { background: var(--gold); color: var(--navy); padding: .8rem 2rem; border: none; border-radius: 7px; font-weight: 700; cursor: pointer; margin-top: 1.5rem; transition: 0.3s; }
.btn-primary:hover { background: var(--gold3); transform: translateY(-2px); }
#statusMsg { margin-top: 1rem; padding: .7rem; border-radius: 5px; display: none; font-size: .85rem; }
.ok { background: rgba(45,212,191,0.1); color: var(--teal); border: 1px solid var(--teal); }
.err { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid var(--red); }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th { text-align: left; color: var(--gold); padding: 1rem; border-bottom: 2px solid var(--gold); font-family: 'Cinzel'; font-size: .75rem; }
td { padding: 1rem; border-bottom: 1px solid rgba(224,201,127,0.1); font-size: .85rem; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <svg class="kr-logo-svg" viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="10" width="10" height="50" fill="white"/>
      <rect x="22" y="25" width="10" height="35" fill="white"/>
      <rect x="36" y="15" width="10" height="45" fill="white"/>
      <rect x="8" y="8" width="38" height="5" fill="#FFE600"/>
    </svg>
    <div class="brand">
      <h1>Krystal Soluciones</h1>
      <p>Vidrio · Acero · Aluminio</p>
    </div>
  </div>
  <div style="margin-left:auto; text-align:right; font-size:0.7rem; color:var(--gray);">
    313 267 47 07 · Bogotá
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('ingreso', this)">Ingreso</button>
    <button class="tab-btn" onclick="switchTab('inventario', this)">Inventario</button>
  </div>

  <div id="tab-ingreso" class="tab-panel active">
    <div class="card">
      <div class="form-grid">
        <div class="field">
          <label>ID Producto *</label>
          <input type="text" id="idProducto" placeholder="PRD-001">
        </div>
        <div class="field">
          <label>Nombre *</label>
          <input type="text" id="nombre" placeholder="Ej: Vidrio Templado 10mm">
        </div>
        <div class="field">
          <label>Cantidad *</label>
          <input type="number" id="cantidad" value="1">
        </div>
        <div class="field">
          <label>Bodega *</label>
          <select id="bodega">
            <option value="Krystal">Krystal</option>
            <option value="Carrera 30">Carrera 30</option>
            <option value="Teusaquillo">Teusaquillo</option>
          </select>
        </div>
        <div class="field">
          <label>Costo Unitario *</label>
          <input type="number" id="costoUnit" value="0">
        </div>
        <div class="field">
          <label>Fecha de Factura</label>
          <input type="date" id="fechaIngreso">
        </div>
        <div class="field full">
          <label>Descripción</label>
          <textarea id="descripcion" rows="2"></textarea>
        </div>
      </div>
      <button class="btn-primary" onclick="submitForm()">Registrar Compra</button>
      <div id="statusMsg"></div>
    </div>
  </div>

  <div id="tab-inventario" class="tab-panel">
    <div class="card">
      <button class="tab-btn" onclick="actualizarTabla()" style="border:1px solid var(--gold); margin-bottom:1rem;">↻ Refrescar Tabla</button>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Nro</th>
              <th>ID</th>
              <th>Producto</th>
              <th>Cant.</th>
              <th>Bodega</th>
              <th>Costo</th>
            </tr>
          </thead>
          <tbody id="inventarioBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwRZB7tswXbF6Dj_ZCAsWLQ-sUmTqSBsgZpU1WM3lWQH3lleeSkXhpmLKChe_212P7J/exec";

// Configurar fecha hoy
document.getElementById("fechaIngreso").value = new Date().toISOString().split("T")[0];

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
  if(tab === 'inventario') actualizarTabla();
}

// ── ENVÍO DE DATOS COMPATIBLE CON TU SCRIPT ──
async function submitForm() {
  const msg = document.getElementById("statusMsg");
  const get = (id) => document.getElementById(id).value.trim();

  if(!get("idProducto") || !get("nombre") || !get("cantidad")) {
    showMsg("⚠ Completa los campos obligatorios", "err");
    return;
  }

  // Objeto JSON exactamente como lo espera tu doPost(e)
  const payload = {
    idProducto: get("idProducto"),
    nombre: get("nombre"),
    descripcion: get("descripcion"),
    cantidad: get("cantidad"),
    bodega: get("bodega"),
    costoUnit: get("costoUnit"),
    fechaIngreso: get("fechaIngreso")
  };

  showMsg("⏳ Guardando en la nube...", "ok");

  try {
    // Para Google Apps Script POST con JSON, a veces 'no-cors' falla si el script espera leer el body.
    // Usamos el enfoque de enviar como texto plano para saltar restricciones de CORS.
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" }, 
      body: JSON.stringify(payload)
    });

    showMsg("✔ ¡Registro guardado exitosamente!", "ok");
    // Limpiar campos
    ["idProducto", "nombre", "descripcion", "cantidad", "costoUnit"].forEach(id => document.getElementById(id).value = "");
  } catch (e) {
    showMsg("❌ Error de conexión: " + e, "err");
  }
}

async function actualizarTabla() {
  const body = document.getElementById("inventarioBody");
  body.innerHTML = "<tr><td colspan='6'>Cargando datos...</td></tr>";
  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();
    body.innerHTML = data.map(r => `
      <tr>
        <td>${r.nroCompra}</td>
        <td>${r.idProducto}</td>
        <td style="font-weight:600">${r.nombre}</td>
        <td>${r.cantidad}</td>
        <td>${r.bodega}</td>
        <td>$${Number(r.costoUnit).toLocaleString()}</td>
      </tr>
    `).join("");
  } catch (e) {
    body.innerHTML = "<tr><td colspan='6'>Error: Asegúrate de que el script esté publicado como 'Cualquier persona'.</td></tr>";
  }
}

function showMsg(txt, cls) {
  const msg = document.getElementById("statusMsg");
  msg.textContent = txt;
  msg.className = cls;
  msg.style.display = "block";
}
</script>
</body>
</html>
