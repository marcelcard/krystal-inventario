<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Krystal · Módulo de Inventario</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Fira+Code:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --navy:   #0f0f1e;
  --navy2:  #1a1a2e;
  --navy3:  #16213e;
  --gold:   #e0c97f;
  --gold2:  #c9a84c;
  --gold3:  #f5e6b0;
  --teal:   #2dd4bf;
  --red:    #f87171;
  --white:  #f0eff6;
  --gray:   #8888aa;
  --yellow: #FFE600;
  --radius: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,.55);
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--navy);
  color: var(--white);
  font-family: 'Raleway', sans-serif;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,201,127,.08) 0%, transparent 60%);
}

/* ── HEADER (ESTILO REMISIÓN) ──────────────────────────── */
header {
  background: linear-gradient(135deg, var(--navy2) 0%, #0d1b3e 100%);
  border-bottom: 1px solid rgba(224,201,127,.25);
  padding: 0 2.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  height: 90px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 24px rgba(0,0,0,.6);
}
.logo-wrap { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
.kr-logo-svg { width: 45px; height: auto; }
.brand h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.4rem; font-weight: 700;
  color: var(--white); letter-spacing: .08em;
  line-height: 1; text-transform: uppercase;
}
.brand p {
  font-size: .65rem; color: var(--gold);
  letter-spacing: .15em; text-transform: uppercase;
  font-weight: 600; margin-top: 2px;
}
.header-divider { width: 1px; height: 40px; background: rgba(224,201,127,.2); }
.header-sub { font-size: .85rem; color: var(--gold3); font-family: 'Cinzel', serif; font-weight: 600; }

/* ── MAIN & TABS ────────────────────────────────────────── */
main { max-width: 1300px; margin: 0 auto; padding: 2rem; }
.tabs { display: flex; gap: .5rem; border-bottom: 1px solid rgba(224,201,127,.15); margin-bottom: 2rem; }
.tab-btn {
  background: none; border: none; padding: .75rem 1.5rem;
  font-family: 'Raleway', sans-serif; font-size: .85rem; font-weight: 600;
  color: var(--gray); cursor: pointer; position: relative; text-transform: uppercase;
}
.tab-btn.active { color: var(--gold); }
.tab-btn.active::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--gold2), var(--gold));
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── CARD & FORM ────────────────────────────────────────── */
.card { background: var(--navy2); border: 1px solid rgba(224,201,127,.15); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
.field { display: flex; flex-direction: column; gap: .45rem; }
.field.full { grid-column: 1 / -1; }
label { font-size: .75rem; color: var(--gray); font-weight: 600; text-transform: uppercase; }
input, textarea, select {
  background: rgba(255,255,255,.04); border: 1px solid rgba(224,201,127,.2);
  border-radius: 7px; padding: .65rem; color: var(--white); outline: none;
}
input[readonly] { background: rgba(224,201,127,.05); color: var(--gold3); font-family: 'Fira Code', monospace; }

/* ── BUTTONS ────────────────────────────────────────────── */
.form-actions { display: flex; gap: 1rem; align-items: center; margin-top: 2rem; border-top: 1px solid rgba(224,201,127,.1); pt: 1.5rem; }
.btn { padding: .7rem 1.5rem; border: none; border-radius: 7px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-primary { background: var(--gold); color: var(--navy); }
.btn-secondary { background: transparent; border: 1px solid var(--gold2); color: var(--gold); }

/* ── TABLE ──────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; margin-top: 1rem; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
thead th { background: var(--navy3); color: var(--gold); padding: 1rem; text-align: left; border-bottom: 2px solid var(--gold); }
tbody td { padding: 1rem; border-bottom: 1px solid rgba(224,201,127,.1); }

#statusMsg { display: none; padding: .5rem 1rem; border-radius: 5px; font-size: .8rem; }
.ok { background: rgba(45,212,191,0.1); color: var(--teal); border: 1px solid var(--teal); }
.err { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <svg class="kr-logo-svg" viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="10" width="10" height="50" fill="white"/>
      <rect x="22" y="25" width="10" height="35" fill="white"/>
      <rect x="36" y="15" width="10" height="45" fill="white"/>
      <rect x="8" y="8" width="38" height="5" fill="#FFE600"/>
    </svg>
    <div class="brand">
      <h1>Krystal Soluciones</h1>
      <p>Vidrio · Acero · Aluminio</p>
    </div>
  </div>
  <div class="header-divider"></div>
  <span class="header-sub">Módulo de Inventario</span>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('ingreso', this)">Ingreso de Compra</button>
    <button class="tab-btn" onclick="switchTab('inventario', this)">Ver Inventario</button>
  </div>

  <div id="tab-ingreso" class="tab-panel active">
    <div class="card">
      <div class="form-grid">
        <div class="field">
          <label>Nro Compra (Auto)</label>
          <input type="text" id="nroCompra" readonly placeholder="OC-XXXXX">
        </div>
        <div class="field">
          <label>Registro del Sistema</label>
          <input type="text" id="fechaAuto" readonly>
        </div>
        <div class="field">
          <label>ID Producto *</label>
          <input type="text" id="idProducto" placeholder="PRD-001">
        </div>
        <div class="field">
          <label>Nombre *</label>
          <input type="text" id="nombre" placeholder="Nombre del producto">
        </div>
        <div class="field full">
          <label>Descripción</label>
          <textarea id="descripcion" rows="2"></textarea>
        </div>
        <div class="field">
          <label>Cantidad *</label>
          <input type="number" id="cantidad" value="0">
        </div>
        <div class="field">
          <label>Bodega *</label>
          <select id="bodega">
            <option value="Krystal">Krystal</option>
            <option value="Carrera 30">Carrera 30</option>
            <option value="Teusaquillo">Teusaquillo</option>
          </select>
        </div>
        <div class="field">
          <label>Costo Unitario *</label>
          <input type="number" id="costoUnit" value="0">
        </div>
        <div class="field">
          <label>Fecha de Factura</label>
          <input type="date" id="fechaIngreso">
        </div>
      </div>
      
      <div class="form-actions">
        <button class="btn btn-primary" onclick="submitForm()">Registrar en Google</button>
        <button class="btn btn-secondary" onclick="resetForm()">Limpiar</button>
        <div id="statusMsg"></div>
      </div>
    </div>
  </div>

  <div id="tab-inventario" class="tab-panel">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="color:var(--gold); font-family:'Cinzel';">Stock Actual</h3>
        <button class="btn btn-secondary" onclick="actualizarTabla()" style="font-size:0.7rem;">↻ Actualizar</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>OC</th>
              <th>ID</th>
              <th>Producto</th>
              <th>Cant.</th>
              <th>Bodega</th>
              <th>Costo Unit.</th>
            </tr>
          </thead>
          <tbody id="inventarioBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwRZB7tswXbF6Dj_ZCAsWLQ-sUmTqSBsgZpU1WM3lWQH3lleeSkXhpmLKChe_212P7J/exec";

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("fechaIngreso").value = new Date().toISOString().split("T")[0];
  actualizarFechaAuto();
  setInterval(actualizarFechaAuto, 1000);
});

function actualizarFechaAuto() {
  const now = new Date();
  document.getElementById("fechaAuto").value = now.toLocaleString();
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
  if(tab === 'inventario') actualizarTabla();
}

function resetForm() {
  ["idProducto", "nombre", "descripcion", "cantidad", "costoUnit"].forEach(id => document.getElementById(id).value = "");
}

async function submitForm() {
  const msg = document.getElementById("statusMsg");
  const get = (id) => document.getElementById(id).value.trim();

  if(!get("idProducto") || !get("nombre") || !get("cantidad")) {
    msg.textContent = "⚠ Faltan campos";
    msg.className = "err"; msg.style.display = "block";
    return;
  }

  const payload = {
    idProducto: get("idProducto"),
    nombre: get("nombre"),
    descripcion: get("descripcion"),
    cantidad: get("cantidad"),
    bodega: get("bodega"),
    costoUnit: get("costoUnit"),
    fechaIngreso: get("fechaIngreso")
  };

  msg.textContent = "Enviando...";
  msg.className = "ok"; msg.style.display = "block";

  try {
    // Usamos POST tal cual lo espera tu doPost(e)
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors", 
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    msg.textContent = "✔ Registro guardado";
    resetForm();
  } catch (e) {
    msg.textContent = "❌ Error: " + e;
    msg.className = "err";
  }
}

async function actualizarTabla() {
  const body = document.getElementById("inventarioBody");
  body.innerHTML = "<tr><td colspan='6'>Cargando...</td></tr>";
  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();
    body.innerHTML = data.map(r => `
      <tr>
        <td>${r.nroCompra}</td>
        <td>${r.idProducto}</td>
        <td style="font-weight:600">${r.nombre}</td>
        <td>${r.cantidad}</td>
        <td>${r.bodega}</td>
        <td>$${Number(r.costoUnit).toLocaleString()}</td>
      </tr>
    `).join("");
  } catch (e) {
    body.innerHTML = "<tr><td colspan='6'>Error al cargar datos</td></tr>";
  }
}
</script>
</body>
</html>
