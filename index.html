<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Krystal · Inventario (CORS Fix)</title>
</head>
<body>

<h2>Registro Inventario (CORS Fix)</h2>

<form id="form">
  <input type="text" name="idProducto" placeholder="ID Producto" required><br><br>
  <input type="text" name="nombre" placeholder="Nombre" required><br><br>
  <input type="number" name="cantidad" placeholder="Cantidad" required><br><br>
  <input type="text" name="bodega" placeholder="Bodega" required><br><br>
  <input type="number" name="costoUnit" placeholder="Costo" required><br><br>
  <input type="date" name="fechaIngreso" required><br><br>

  <button type="submit">Enviar</button>
</form>

<p id="status"></p>

<script>
// ⚠️ REEMPLAZA POR TU URL DE GOOGLE APPS SCRIPT
const GAS_URL = "https://script.google.com/macros/s/AKfycbyFSZ6AnVI-izNscHrZCqs7FL-tW4hNlrAGDyhiOH0FjHFJyguqhtoK5gEzFW9Vc-mBtQ/exec";

// ─────────────────────────────────────────────
// ENVÍO SIN CORS (TRUCO CON FORMULARIO + IFRAME)
// ─────────────────────────────────────────────

document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  // Crear iframe oculto
  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  document.body.appendChild(iframe);

  // Crear formulario temporal
  const tempForm = document.createElement("form");
  tempForm.method = "POST";
  tempForm.action = GAS_URL;
  tempForm.target = iframe.name = "hidden_iframe_" + Date.now();

  // Copiar datos
  for (let [key, value] of formData.entries()) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    tempForm.appendChild(input);
  }

  document.body.appendChild(tempForm);

  // Enviar
  tempForm.submit();

  document.getElementById("status").innerText = "✔ Enviado (sin CORS)";

  // Limpiar
  tempForm.remove();
  setTimeout(() => iframe.remove(), 2000);
});

// ─────────────────────────────────────────────
// GET SIN CORS (JSONP con <script>)
// ─────────────────────────────────────────────

function cargarInventario() {
  const script = document.createElement("script");
  script.src = GAS_URL + "?action=getInventario&callback=renderData";
  document.body.appendChild(script);
}

function renderData(data) {
  console.log("Inventario:", data);
}

</script>

</body>
</html>
