<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krystal · Inventario Premium</title>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f0f1e,#1a1a2e);
  color:white;
  padding:20px;
}
.card{
  background:#1a1a2e;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #333;
  background:#0f0f1e;
  color:white;
}
button{
  padding:10px 20px;
  background:#e0c97f;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #333;
}
th{
  color:#e0c97f;
}
</style>
</head>

<body>

<h1>KRYSTAL · Inventario Premium</h1>

<div class="card">
<h3>Nuevo ingreso</h3>

<input id="idProducto" placeholder="ID Producto">
<input id="nombre" placeholder="Nombre">
<input id="descripcion" placeholder="Descripción">
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="bodega" placeholder="Bodega">
<input id="costoUnit" type="number" placeholder="Costo">
<input id="fechaIngreso" type="date">

<button onclick="guardar()">Guardar</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>Inventario</h3>
<button onclick="cargar()">Actualizar</button>

<table>
<thead>
<tr>
<th>OC</th>
<th>ID</th>
<th>Nombre</th>
<th>Cantidad</th>
<th>Bodega</th>
<th>Costo</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw2yA_RRt_4AqER4h3_T8jIAD4HZQTD0U80X-hSs3a5Iu5RvrrRorhqZ6_Vc3kanHXm/exec";

function val(id){ return document.getElementById(id).value; }
function msg(t){ document.getElementById("msg").innerText=t; }

async function guardar(){
  const data = {
    idProducto: val("idProducto"),
    nombre: val("nombre"),
    descripcion: val("descripcion"),
    cantidad: Number(val("cantidad")),
    bodega: val("bodega"),
    costoUnit: Number(val("costoUnit")),
    fechaIngreso: val("fechaIngreso")
  };

  const res = await fetch(GAS_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });

  const json = await res.json();

  if(json.ok){
    msg("Guardado: "+json.nroCompra);
    cargar();
  }else{
    msg("Error");
  }
}

async function cargar(){
  const res = await fetch(GAS_URL);
  const data = await res.json();

  const tabla = document.getElementById("tabla");
  tabla.innerHTML="";

  data.forEach(r=>{
    tabla.innerHTML += `
      <tr>
        <td>${r.nroCompra}</td>
        <td>${r.idProducto}</td>
        <td>${r.nombre}</td>
        <td>${r.cantidad}</td>
        <td>${r.bodega}</td>
        <td>${r.costoUnit}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
