<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Krystal · Módulo de Inventario</title>
    <!-- Elimina errores de favicon y carga tipografías -->
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --navy: #0f0f1e; --navy2: #1a1a2e; --navy3: #16213e;
            --gold: #e0c97f; --gold2: #c9a84c; --gold3: #f5e6b0;
            --teal: #2dd4bf; --red: #f87171; --white: #f0eff6;
            --gray: #8888aa; --yellow: #FFE600;
            --radius: 10px; --shadow: 0 8px 32px rgba(0,0,0,.55);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--navy);
            color: var(--white);
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,201,127,.08) 0%, transparent 60%);
        }

        /* ── HEADER ESTILO REMISIÓN ── */
        header {
            background: linear-gradient(135deg, var(--navy2) 0%, #0d1b3e 100%);
            border-bottom: 1px solid rgba(224,201,127,.25);
            padding: 0 2.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            height: 90px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(0,0,0,.6);
        }

        .logo-wrap { display: flex; align-items: center; gap: 1rem; }
        .kr-logo-svg { width: 45px; height: auto; }
        
        .brand h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.4rem; font-weight: 700;
            color: var(--white); letter-spacing: .08em;
            line-height: 1; text-transform: uppercase;
        }

        .brand p {
            font-size: .65rem; color: var(--gold);
            letter-spacing: .15em; text-transform: uppercase;
            font-weight: 600; margin-top: 2px;
        }

        .header-divider { width: 1px; height: 40px; background: rgba(224,201,127,.2); }
        .header-sub { font-size: .85rem; color: var(--gold3); font-family: 'Cinzel', serif; font-weight: 600; }

        /* ── DISEÑO DE PESTAÑAS ── */
        main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        
        .tabs {
            display: flex; gap: .5rem;
            border-bottom: 1px solid rgba(224,201,127,.15);
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: none; border: none;
            padding: .75rem 1.5rem;
            font-family: 'Raleway', sans-serif; font-size: .85rem;
            font-weight: 600; color: var(--gray);
            cursor: pointer; position: relative;
            letter-spacing: .06em; text-transform: uppercase;
            transition: color .2s;
        }

        .tab-btn.active { color: var(--gold); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--gold2), var(--gold));
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── FORMULARIO Y TARJETAS ── */
        .card {
            background: var(--navy2);
            border: 1px solid rgba(224,201,127,.15);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .field { display: flex; flex-direction: column; gap: .5rem; }
        .field.full { grid-column: 1 / -1; }

        label {
            font-size: .75rem; font-weight: 600;
            color: var(--gray); letter-spacing: .1em; text-transform: uppercase;
        }

        input, textarea, select {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(224,201,127,.2);
            border-radius: 7px; padding: .75rem;
            color: var(--white); font-family: 'Raleway', sans-serif;
            outline: none; transition: 0.3s;
        }

        input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(224,201,127,0.1); }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold2), var(--gold));
            color: var(--navy);
            padding: 1rem 2rem; border: none; border-radius: 7px;
            font-weight: 700; cursor: pointer; margin-top: 1.5rem;
            text-transform: uppercase; letter-spacing: 0.1em;
            transition: 0.3s;
        }

        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* ── ESTADOS Y TABLAS ── */
        #statusMsg {
            margin-top: 1.5rem; padding: 1rem;
            border-radius: 7px; display: none; text-align: center;
            font-weight: 600; font-size: 0.9rem;
        }

        .ok { background: rgba(45,212,191,0.1); color: var(--teal); border: 1px solid var(--teal); }
        .err { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid var(--red); }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; color: var(--gold); padding: 1rem; border-bottom: 2px solid var(--gold); font-family: 'Cinzel'; font-size: .75rem; }
        td { padding: 1rem; border-bottom: 1px solid rgba(224,201,127,0.1); font-size: .85rem; }

        iframe { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-wrap">
            <svg class="kr-logo-svg" viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="10" width="10" height="50" fill="white"/>
                <rect x="22" y="25" width="10" height="35" fill="white"/>
                <rect x="36" y="15" width="10" height="45" fill="white"/>
                <rect x="8" y="8" width="38" height="5" fill="#FFE600"/>
            </svg>
            <div class="brand">
                <h1>Krystal Soluciones</h1>
                <p>Vidrio · Acero · Aluminio</p>
            </div>
        </div>
        <div class="header-divider"></div>
        <span class="header-sub">Gestión de Inventario</span>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ingreso', this)">Registrar Ingreso</button>
            <button class="tab-btn" onclick="switchTab('inventario', this)">Consultar Stock</button>
        </div>

        <!-- SECCIÓN: REGISTRO -->
        <div id="tab-ingreso" class="tab-panel active">
            <div class="card">
                <!-- FORMULARIO DIRECTO AL IFRAME PARA EVITAR BLOQUEOS -->
                <form id="mainForm" action="https://script.google.com/macros/s/AKfycbwRZB7tswXbF6Dj_ZCAsWLQ-sUmTqSBsgZpU1WM3lWQH3lleeSkXhpmLKChe_212P7J/exec" method="POST" target="hidden_iframe" onsubmit="prepararEnvio()">
                    <div class="form-grid">
                        <div class="field">
                            <label>ID Producto *</label>
                            <input type="text" name="idProducto" id="idProducto" required placeholder="PRD-001">
                        </div>
                        <div class="field">
                            <label>Nombre del Item *</label>
                            <input type="text" name="nombre" id="nombre" required placeholder="Ej: Herraje Acero 304">
                        </div>
                        <div class="field">
                            <label>Cantidad *</label>
                            <input type="number" name="cantidad" id="cantidad" required value="1" min="1">
                        </div>
                        <div class="field">
                            <label>Bodega</label>
                            <select name="bodega" id="bodega">
                                <option value="Krystal">Krystal</option>
                                <option value="Carrera 30">Carrera 30</option>
                                <option value="Teusaquillo">Teusaquillo</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Costo Unitario (COP)</label>
                            <input type="number" name="costoUnit" id="costoUnit" value="0">
                        </div>
                        <div class="field">
                            <label>Fecha de Factura</label>
                            <input type="date" name="fechaIngreso" id="fechaIngreso">
                        </div>
                        <div class="field full">
                            <label>Descripción / Observaciones</label>
                            <textarea name="descripcion" id="descripcion" rows="2" placeholder="Detalles adicionales..."></textarea>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">Sincronizar con Google Sheets</button>
                </form>
                
                <div id="statusMsg"></div>
            </div>
        </div>

        <!-- SECCIÓN: TABLA DE INVENTARIO -->
        <div id="tab-inventario" class="tab-panel">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h3 style="font-family:'Cinzel'; color:var(--gold);">Existencias en Tiempo Real</h3>
                    <button class="tab-btn" onclick="cargarInventario()" style="border:1px solid var(--gold); font-size:0.7rem; padding: 0.5rem 1rem;">↻ Actualizar Lista</button>
                </div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>OC</th>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Cant.</th>
                                <th>Bodega</th>
                                <th>Costo Unit.</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <tr><td colspan="6" style="text-align:center; color:var(--gray);">Haz clic en actualizar para cargar los datos</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- IFRAME OCULTO PARA EL PROCESAMIENTO -->
    <iframe name="hidden_iframe" id="hidden_iframe" onload="if(enviando) { finalizarEnvio(); }"></iframe>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwRZB7tswXbF6Dj_ZCAsWLQ-sUmTqSBsgZpU1WM3lWQH3lleeSkXhpmLKChe_212P7J/exec";
        let enviando = false;

        // Al iniciar, poner fecha actual
        document.getElementById("fechaIngreso").value = new Date().toISOString().split("T")[0];

        function switchTab(name, btn) {
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById("tab-" + name).classList.add("active");
            btn.classList.add("active");
            if(name === 'inventario') cargarInventario();
        }

        function prepararEnvio() {
            enviando = true;
            const msg = document.getElementById("statusMsg");
            msg.textContent = "⏳ Procesando envío a la nube de Google...";
            msg.className = "ok";
            msg.style.display = "block";
        }

        function finalizarEnvio() {
            const msg = document.getElementById("statusMsg");
            msg.textContent = "✔ ¡Datos guardados correctamente en Google Sheets!";
            document.getElementById("mainForm").reset();
            document.getElementById("fechaIngreso").value = new Date().toISOString().split("T")[0];
            enviando = false;
        }

        async function cargarInventario() {
            const body = document.getElementById("tablaBody");
            body.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Conectando con el servidor...</td></tr>";
            
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                if (data.length === 0) {
                    body.innerHTML = "<tr><td colspan='6' style='text-align:center;'>No hay registros aún</td></tr>";
                    return;
                }

                body.innerHTML = data.map(r => `
                    <tr>
                        <td>${r.nroCompra || '---'}</td>
                        <td>${r.idProducto}</td>
                        <td style="font-weight:600">${r.nombre}</td>
                        <td style="color:var(--teal)">${r.cantidad}</td>
                        <td>${r.bodega}</td>
                        <td>$${Number(r.costoUnit).toLocaleString()}</td>
                    </tr>
                `).join("");
            } catch (e) {
                body.innerHTML = "<tr><td colspan='6' style='text-align:center; color:var(--red);'>Error al cargar. Verifica la publicación del script.</td></tr>";
            }
        }
    </script>
</body>
</html>
